# Battery monitor on GPIO35 (200k/200k divider), both tiers.
# hal prints `Battery: <status>` every second; idf prints one reading per boot, then deep-sleeps 60 s.
# Without a battery on USB the charger holds BAT at ~4.16 V, a false ~96 % (docs/project-lore.md -> Hardware — Adafruit ESP32 Feather V2); judge with a battery fitted.
# Meter and board must read the same net at the same moment: BAT and GND header pins with USB in.
# A pack metered unplugged rests about 150 mV lower than on BAT with USB in, which is not an ADC error.
# The attended step captures its own `Battery:` line, as captures do not cross the mode split; the question then shows the value.
examples = ["hal_esp32_battery", "idf_esp32_battery"]

[[step]]
say = "Wait for a battery reading"
expect = 'Battery: '
reject = 'ADC read failed|PANIC|panicked|Guru Meditation'
timeout = 15
arm = false       # idf prints its only reading right after the reset

[[step]]
say = "Now: hold the meter on the BAT and GND header pins (USB stays in); waiting for a Battery: line"
expect = 'Battery: (?P<mv>\d+)mV'
reject = 'ADC read failed|PANIC|panicked|Guru Meditation'
timeout = 15      # sees the boot reading too, so idf's single line counts
attended = true
arm = false

[[step]]
say = "The board printed {mv} mV"
confirm = "Does the meter on BAT and GND read within about 100 mV of {mv} mV?"
