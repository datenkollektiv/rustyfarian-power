# Battery monitor on GPIO1 (always-on divider), both tiers; prints `Battery: <status>` every 1-2 s.
# Unattended only: the meter comparison lives in `battery-calib`, which runs the same monitors
# with the raw value printed and a 1 % tolerance, so this check does not ask for the meter a second time.
# A run printing `USB/Ext` or `No battery` has no voltage to match — recalibrate with
# `battery-calib` first.
# Meter the pack's polarity BEFORE connecting it (docs/project-lore.md -> Hardware).
examples = ["hal_s3_battery", "idf_esp32s3_battery"]

[[step]]
say = "Wait for three voltage readings (mV)"
expect = ['Battery: \d+mV', 'Battery: \d+mV', 'Battery: \d+mV']
reject = 'ADC read failed|PANIC|panicked|Guru Meditation'
timeout = 15
