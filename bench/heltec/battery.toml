# Battery monitor on GPIO1 (always-on divider, ratio 5.55), both tiers; prints `Battery: <status>` every 1-2 s.
# Without a battery on USB the charger rail reads a false ~80 % (docs/key-insights.md); judge with a battery fitted.
# Check the pack's polarity with a meter before connecting it (docs/project-lore.md -> Hardware).
examples = ["hal_s3_battery", "idf_esp32s3_battery"]

[[step]]
say = "Wait for three battery readings"
expect = ['Battery: ', 'Battery: ', 'Battery: ']
reject = 'ADC read failed|PANIC|panicked|Guru Meditation'
timeout = 15

[[step]]
say = "Compare the printed voltage with a meter across the battery"
confirm = "Printed mV within about 100 mV of the meter?"
