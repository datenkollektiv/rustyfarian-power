# RTC retention across timer deep sleep on the S3 (RTC slow memory), ESP-IDF tier only (no esp-hal twin yet).
# Default build: action `sleep`, 5 s timer.
examples = ["idf_s3_rtc_retention"]

[[step]]
say = "Wait for the first boot line"
expect = 'RET reset=\w+ wake=\w+ load=\S+ boots=\d+'
timeout = 10
optional = true   # can be printed before the port reopens after reset
arm = false       # must read the backlog from the reset

[[step]]
say = "Hands off: watch two 5 s timer wakes keep the record"
expect = ['RET reset=DeepSleep wake=Timer load=ok', 'RET reset=DeepSleep wake=Timer load=ok']
reject = 'load=err|store failed|sleep failed|PANIC|panicked|Guru Meditation'
timeout = 30
