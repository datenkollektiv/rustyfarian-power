# Bench definition for rustyfarian-bench (`just bench <target>`).
# Scenarios live in bench/<board>/*.toml; see bench/README.md.
# `bench-build` / `bench-flash` dispatch on the name: `idf_*` through the ESP-IDF recipes,
# `hal_<chip>_*` through the esp-hal recipe for that chip.

[commands]
build = ["just", "bench-build", "{example}"]
flash = ["just", "bench-flash", "{example}", "{port}"]

[boards.c3-mini1]
chip = "esp32c3"
name = "ESP32-C3-DevKitM-1 (ESP32-C3-MINI-1), UART bridge, HC-SR501 PIR on GPIO4"
checks = ["retention"]   # first; needs no wiring

[boards.s3-heltec]
chip = "esp32s3"
name = "Heltec WiFi LoRa 32 V3 (ESP32-S3, CP2102 bridge)"
mac = "64:e8:33:69:d7:38"   # the CrowPanel is an ESP32-S3 too; the MAC picks this board
checks = ["retention"]   # first; needs no battery

[boards.esp32-feather]
chip = "esp32"
name = "Adafruit ESP32 Feather V2"

[boards.s3]
chip = "esp32s3"
name = "CrowPanel 1.28\" HMI (ESP32-S3, USB-Serial-JTAG), CST816S touch INT on GPIO5"
mac = "1c:db:d4:b3:6d:40"   # the Heltec V3 is an ESP32-S3 too; the MAC (as espflash reports it) picks this board
checks = ["sleep"]   # first; needs no hands
