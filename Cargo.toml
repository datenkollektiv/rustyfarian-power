[workspace]
resolver = "2"
members = ["crates/*"]
# The esp-hal tier (`rustyfarian-esp-hal-power`) only builds for `*-none-elf`
# targets, via the `*-hal` just recipes. Keeping it out of the default members
# keeps it out of bare `cargo check/build/clippy` (the `*-all` recipes).
default-members = ["crates/stoker", "crates/rustyfarian-esp-idf-power"]

[workspace.package]
version = "0.2.0"
authors = ["datenkollektiv"]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/datenkollektiv/rustyfarian-power"

[workspace.dependencies]
# Workspace-internal
stoker = { path = "crates/stoker", version = "0.2" }

# External dependencies
anyhow = "1"
log = "0.4"

# ESP-IDF dependencies — September 2026 wave, in step with the sibling
# rustyfarian repos. esp-idf-hal 0.47 pulls esp-idf-sys 0.38 (a `links` crate:
# one version per downstream graph) and requires embuild >= 0.33.5.
esp-idf-hal = "0.47"
embuild = { version = "0.33.5", features = ["espidf"] }

# Bare-metal (esp-hal) dependencies — exact pin, in lockstep with the sibling
# rustyfarian repos (ws2812, network, peripherals are all `=1.2.2`); apps that
# combine the hal tiers will not resolve otherwise. esp-hal 1.2 declares
# rust-version 1.95.
esp-hal = { version = "=1.2.2" }
# The hal sleep path arms wake pins and enters sleep with interrupts masked; esp-hal
# (default `rt`) provides the implementation, the crate only calls `critical_section::with`.
critical-section = "1.2"
