name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Setup just
        uses: extractions/setup-just@v4
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Deny (licenses, advisories, bans)
        run: just deny
      - name: Check (platform-independent)
        run: just check
      - name: Test (platform-independent)
        run: just test
  # Needs the esp toolchain, not stable: `.cargo/config.toml` sets build-std for
  # the *-espidf targets, which stable cannot do. The job-level RUSTUP_TOOLCHAIN
  # overrides the workflow-level `stable`. The example build links, which `check`
  # cannot verify (a missing SDK symbol only fails at link time), so ldproxy is needed.
  check-c3:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: esp
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup ESP-RS toolchain
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          ldproxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Setup cargo config
        run: cp .cargo/config.toml.dist .cargo/config.toml
      - name: Setup just
        uses: extractions/setup-just@v4
      - name: Check ESP32-C3 (ESP-IDF tier)
        run: just check-c3
      - name: Build and link the C3 example
        run: just build-example idf_c3_deep_sleep_gpio
      - name: Build and link the C3 retention example
        run: just build-example idf_c3_rtc_retention
  # Same toolchain as check-c3; a separate job so the S3 ESP-IDF build runs in
  # parallel. Only the retention example exists for the S3, and it links against
  # a different RTC memory layout than the C3 twin.
  check-s3:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: esp
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup ESP-RS toolchain
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          ldproxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Setup cargo config
        run: cp .cargo/config.toml.dist .cargo/config.toml
      - name: Setup just
        uses: extractions/setup-just@v4
      - name: Build and link the S3 retention example
        run: just build-example idf_s3_rtc_retention
