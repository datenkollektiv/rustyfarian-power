name: esp-hal tier
# Gates the bare-metal esp-hal tier: `cargo check` for all four chips, then a release
# link of the C3 and S3 examples (ADR-003 point 5: provider failures are link-time
# facts). Green means "compiles and links under the current esp toolchain", not
# "hardware-validated". The original ESP32 stays compile-only (its line inside
# `just check-hal`); there is no ESP32 link build and hardware is deferred.
# A separate workflow keeps rust.yml readable; the ESP-IDF tier lives there.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cross-target-esp-hal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# XTENSA_VERSION is the family pin (rustyfarian-ci CONVENTIONS.md); keep the local espup install in step.
env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: esp
  XTENSA_VERSION: "1.97.0.0"
jobs:
  hal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # The esp channel carries rust-src, which `-Zbuild-std=core,alloc` needs for the
      # riscv32imc and xtensa *-none-elf targets (no `rustup target add`). The action also
      # puts xtensa-esp-elf-gcc on PATH, which the Xtensa link needs. ldproxy is for the
      # *-espidf targets only, so it is not installed here. One buildtarget is enough: the
      # unified xtensa-esp-elf GCC links ESP32 and S3, and setup-xtensa's cache key rejects commas.
      - name: Setup Xtensa toolchain
        uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-xtensa@v1
        with:
          version: ${{ env.XTENSA_VERSION }}
          buildtargets: esp32
      # The toolchain version is part of the key, so a toolchain bump does not restore stale artifacts.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/hal"
          key: hal-${{ env.XTENSA_VERSION }}
      - name: Setup just
        uses: extractions/setup-just@v4
      - name: Check all chips, link C3 and S3 examples
        run: just ci-hal
