version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # esp-idf-sys is a `links` crate: the esp-idf stack must move in lockstep.
      esp-idf:
        patterns: ["esp-idf-*", "embuild"]
      # The esp-hal crates are pinned with `=` in Cargo.toml and only resolve together.
      esp-hal:
        patterns: ["esp-hal", "esp-hal-*", "esp-bootloader-esp-idf", "esp-println"]
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
