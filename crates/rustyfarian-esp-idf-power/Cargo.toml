[package]
name = "rustyfarian-esp-idf-power"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Above the workspace floor (1.88, which is `stoker`'s MSRV) by policy, in step
# with the ESP tier crates of the sibling rustyfarian repos; the ESP-IDF stack
# itself only needs 1.82.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "ESP-IDF (std) battery monitoring, charging detection, and deep-sleep drivers for ESP32 and ESP32-S3"
keywords = ["esp32", "esp-idf", "battery", "power", "embedded"]
categories = ["embedded", "hardware-support"]
readme = "README.md"

[lib]
name = "rustyfarian_esp_idf_power"

[features]
default = []
# Provides the process-wide `critical-section` implementation that `stoker::RetainedCell`
# needs, over the FreeRTOS port critical section (interrupt- and multicore-safe). Opt-in: the
# firmware enables exactly one provider, so enable it only when no other provider is linked
# and never together with esp-idf-hal's `critical-section` feature (a task-level mutex that
# FreeRTOS forbids in an ISR), which another crate in the graph may enable.
critical-section-impl = ["dep:critical-section"]

[[example]]
name = "idf_c3_rtc_retention"
required-features = ["critical-section-impl"]

[[example]]
name = "idf_s3_rtc_retention"
required-features = ["critical-section-impl"]

[dependencies]
stoker.workspace = true
anyhow.workspace = true
log.workspace = true
embedded-hal.workspace = true
esp-idf-hal.workspace = true
critical-section = { workspace = true, features = ["restore-state-none"], optional = true }

[build-dependencies]
embuild.workspace = true

# docs.rs cannot build the Xtensa ESP-IDF targets (no Espressif LLVM fork in the
# sandbox); point it at the RISC-V ESP target, which docs.rs supports. A failed
# docs.rs build is expected, not a regression — the README is the primary docs.
[package.metadata.docs.rs]
default-target = "riscv32imc-esp-espidf"
