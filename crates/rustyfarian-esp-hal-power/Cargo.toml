[package]
name = "rustyfarian-esp-hal-power"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Above the workspace floor (1.88, which is `stoker`'s MSRV): esp-hal 1.2
# declares rust-version 1.95. Cargo enforces `rust-version` against the active
# toolchain; the pinned `esp` toolchain reports 1.95.0-nightly, which satisfies
# it (Cargo ignores the `-nightly` suffix when comparing). A toolchain below
# that fails with "not supported by the following package".
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "Bare-metal (esp-hal) battery monitoring, charging detection, and deep-sleep drivers for ESP32-C3, ESP32-C6, ESP32, and ESP32-S3 — the no_std hardware tier of the rustyfarian power stack"
keywords = ["esp32", "esp-hal", "battery", "power", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]
readme = "README.md"
exclude = ["examples/hal_c3_sleep_bench.rs", "examples/hal_esp32_bench_stimulus.rs"]

[lib]
name = "rustyfarian_esp_hal_power"

# docs.rs for a bare-metal crate needs a no_std target and exactly one chip
# feature; the ESP32-C3 (RISC-V, broadest support) is the documented default.
[package.metadata.docs.rs]
default-target = "riscv32imc-unknown-none-elf"
features = ["esp32c3"]

[features]
# Project policy: "ESP32-C3 first" — C3 is the reference chip, so a bare
# `cargo build`/`cargo doc` picks a working chip without extra flags. The chip
# features are mutually exclusive (enforced by `compile_error!` in lib.rs):
# consumers of a non-C3 chip use `--no-default-features --features <chip>` (as
# the `*-hal` just recipes do). `unstable` is bundled because esp-hal gates ADC
# and the sleep API behind it.
default = ["esp32c3", "unstable"]

# ── Chip features ────────────────────────────────────────────────────────────
#
# Each selects the matching chip in esp-hal. Exactly one must be enabled.
esp32c3 = ["esp-hal/esp32c3", "esp-bootloader-esp-idf?/esp32c3", "esp-println?/esp32c3"] # RISC-V, riscv32imc-unknown-none-elf
esp32c6 = ["esp-hal/esp32c6", "esp-bootloader-esp-idf?/esp32c6", "esp-println?/esp32c6"] # RISC-V, riscv32imac-unknown-none-elf
esp32 = ["esp-hal/esp32", "esp-bootloader-esp-idf?/esp32", "esp-println?/esp32"] # Xtensa LX6, xtensa-esp32-none-elf
esp32s3 = ["esp-hal/esp32s3", "esp-bootloader-esp-idf?/esp32s3", "esp-println?/esp32s3"] # Xtensa LX7, xtensa-esp32s3-none-elf

# esp-hal gates ADC and the sleep API behind `unstable`; `rt` pulls in the
# runtime/interrupt vectoring that firmware binaries need.
unstable = ["esp-hal/unstable"]
rt = ["esp-hal/rt"]

# Pulls in the example-only dependencies: the IDF-bootloader app descriptor and serial output.
# `esp-println/auto` prints on USB-Serial-JTAG when a host is attached, else on UART0, so the
# example works whether the board's USB-C reaches the S3's native USB or a USB-UART bridge.
examples = ["rt", "dep:esp-bootloader-esp-idf", "dep:esp-println"]

# Internal, unstable: GPIO marker edges and timing capture around the sleep call for the C3 bench (ESP32-C3 only).
bench = []

[dependencies]
stoker = { workspace = true }

# Bare-metal only. The workspace default target (and so the IDE's) is
# `xtensa-esp32s3-espidf`, where `xtensa-lx-rt`'s build script (via esp-hal)
# panics with "Unsupported target"; gating keeps IDE workspace builds green.
[target.'cfg(target_os = "none")'.dependencies]
esp-hal = { workspace = true }
critical-section = { workspace = true }
esp-bootloader-esp-idf = { workspace = true, optional = true }
esp-println = { workspace = true, optional = true, features = ["auto"] }

[[example]]
name = "hal_s3_deep_sleep_gpio"
required-features = ["esp32s3", "unstable", "examples"]

[[example]]
name = "hal_c3_deep_sleep_gpio"
required-features = ["esp32c3", "unstable", "examples"]

[[example]]
name = "hal_c3_rtc_retention"
required-features = ["esp32c3", "unstable", "examples"]

[[example]]
name = "hal_c3_sleep_bench"
required-features = ["esp32c3", "unstable", "examples", "bench"]

[[example]]
name = "hal_esp32_bench_stimulus"
required-features = ["esp32", "unstable", "examples"]
