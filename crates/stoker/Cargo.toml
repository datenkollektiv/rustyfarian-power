[package]
name = "stoker"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-agnostic battery monitoring, power-source detection, and deep-sleep validation for embedded projects"
keywords = ["battery", "embedded", "power", "sleep", "esp32"]
categories = ["embedded"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
# Off by default: the shared bench line grammar and pin-window bookkeeping (`stoker::bench`)
# used by the tier bench examples. Host tests always compile the module.
bench-conformance = []

[dependencies]
# `RetainedCell` serialises its volatile copies inside
# `critical_section::with`, so the safe `&self` API is sound on every tier. The
# platform supplies the implementation (esp-hal `rt`, esp-idf-hal
# `critical-section`); host tests use the crate's `std` implementation below.
critical-section = { workspace = true }
# Default features only: `GpioRailGate` is generic over `embedded_hal::digital::OutputPin`
# (ADR-004 rung 1), so both tiers share one gate. The crate stays `no_std` and alloc-free.
embedded-hal = { workspace = true }

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }
